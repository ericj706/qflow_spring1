spring.application.name=springproject

server.port = 8080
spring.datasource.url = jdbc:mysql://localhost:3306/maskpack
spring.datasource.username=root
spring.datasource.password=1234

#spring.jpa.hibernate.ddl-auto =  create-drop / update
# 없는 테이블 생성 — 종료할 때 삭제하지 않음
spring.jpa.hibernate.ddl-auto= update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# spring.sql.init.mode = always
# spring.jpa.defer-datasource-initialization = true
# spring.sql.init.encoding=UTF-8
# spring.sql.init.data-locations=classpath:/sql/sample_mask.sql

# 이번 실행에서 데이터 삽입 always , never
spring.sql.init.mode= never
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:/sql/data_mask.sql

# 5공정: LOT당 제품 수와 제품 단위 이상 확률
simulation.packaging-units=100
simulation.packaging-anomaly-rate=0.01
# 4공정: 검사 단위 정상 98%, 주의 1%, 이상 1%
simulation.bulk-warning-rate=0.01
simulation.bulk-failure-rate=0.01

