spring.application.name=springproject

server.port = 8080
spring.datasource.url = jdbc:mysql://localhost:3306/maskpack
spring.datasource.username=root
spring.datasource.password=1234

# 기존 테이블과 데이터를 유지하면서 스키마 변경 반영
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# spring.sql.init.mode = always
# spring.jpa.defer-datasource-initialization = true
# spring.sql.init.encoding=UTF-8
# spring.sql.init.data-locations=classpath:/sql/sample_mask.sql

# 이번 실행에서 데이터 삽입 always , never
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.encoding=UTF-8
spring.sql.init.data-locations=classpath:/sql/data_mask.sql

